<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pengunaan fungsi</title>
</head>
<body>
    <!-- membuat fungsi -->
     <script type="text/javascript">
         
        //fungsi salam
        function salam() {
            document.write('<h2>Assalamualaikum</h2>');
        }
 
        //memanggil fungsi
        salam();
 
    </script>
</body>
</html>









<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pengunaan fungsi</title>
</head>
<body>
    <!-- fungsi dengan parameter -->
     <script type="text/javascript">
 
        //fungsi dengan parameter
        function tambah(a, b) {
            var c = a+b;
            return c
        }
 
        var penjumlahan=tambah(8,10);
        document.write('hasil dari penjumlahan 8 dan 10 adalah '+penjumlahan);
 
    </script>
</body>
</html>
